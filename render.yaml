services:
  - type: web
    name: shinexmarket
    runtime: static
    buildCommand: npm install && npm run build
    staticPublishPath: build
    envVars:
      - key: REACT_APP_API_URL
        value: https://shinex-marketplace.onrender.com/api
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
